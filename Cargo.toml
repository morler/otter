[package]
name = "otter-rt"
version = "0.1.0"
edition = "2024"
authors = ["Giuseppe Della Vedova"]
license = "MIT"
description = "Experimental multithreaded JS runtime"
repository = "https://github.com/gi-dellav/otter"

[[bin]]
name = "otter"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rquickjs = { version = "0.12.2", features = ["parallel"] }
crossbeam-channel = "0.5"
serde_json = "1"
